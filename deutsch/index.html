<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="theme-color" content="#2B2150">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Deutsch-Entdecker</title>
<script>
window.addEventListener("error",function(e){
  var d=document.getElementById("errbox");
  if(!d){d=document.createElement("div");d.id="errbox";d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#E5483D;color:#fff;padding:10px 14px;font:14px/1.3 sans-serif";(document.body||document.documentElement).appendChild(d);}
  d.textContent="Fehler / Error: "+(e.message||"?")+" (Zeile / line "+(e.lineno||"?")+")";
});
</script>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0FF; --bg2:#FBF3FF; --ink:#2B2150; --muted:#6A6396; --card:#FFFFFF; --line:#DDD8F5; --shadow:#C9C1EA;
  --sun:#FFB703; --teal:#169C9C; --coral:#FF6B5E; --blue:#4C7DFF; --green:#2FB67C; --violet:#7B5CFF;
  --der:#3B6FF0; --die:#E04A58; --das:#23A56F; --artc:#FFFFFF; --on:#FFFFFF; --night:#2B2150;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15112C; --bg2:#1D1740; --ink:#F3EEFF; --muted:#A9A1D0; --card:#251F4B; --line:#352E63; --shadow:#0D0A20;
    --sun:#FFC83D; --teal:#3CCFCF; --coral:#FF8A7E; --blue:#7FA3FF; --green:#4FD7A0; --violet:#A28FFF;
    --der:#7FA3FF; --die:#FF8793; --das:#4FD7A0; --artc:#15112C; --on:#15112C; --night:#0D0A20;
  }
}
:root[data-theme="dark"]{
  --bg:#15112C; --bg2:#1D1740; --ink:#F3EEFF; --muted:#A9A1D0; --card:#251F4B; --line:#352E63; --shadow:#0D0A20;
  --sun:#FFC83D; --teal:#3CCFCF; --coral:#FF8A7E; --blue:#7FA3FF; --green:#4FD7A0; --violet:#A28FFF;
  --der:#7FA3FF; --die:#FF8793; --das:#4FD7A0; --artc:#15112C; --on:#15112C; --night:#0D0A20;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0; color:var(--ink); background:linear-gradient(180deg,var(--bg2),var(--bg) 360px) var(--bg); background-attachment:fixed;
  font-family:"Andika","Fredoka",ui-rounded,"Trebuchet MS",sans-serif; font-size:19px; line-height:1.4; -webkit-tap-highlight-color:transparent}
h1,h2,h3,.fr{font-family:"Fredoka","Andika",ui-rounded,sans-serif}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; touch-action:manipulation; -webkit-user-select:none; user-select:none}
button:focus-visible{outline:4px solid var(--blue); outline-offset:2px}
button:disabled{cursor:default}
small{font-weight:400; display:block}
.wrap{max-width:780px; margin:0 auto; padding:10px 14px 44px}

/* top band */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--night); color:#fff; border-radius:0 0 26px 26px; padding:12px 16px; margin:0 -14px 14px; box-shadow:0 5px 0 var(--shadow)}
.brand{font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.35rem; color:#fff; display:flex; align-items:center; gap:8px}
.chip{min-width:46px; height:46px; border-radius:15px; background:rgba(255,255,255,.14); color:#fff; font-size:1.3rem}
.hi{font-size:clamp(1.7rem,6vw,2.3rem); margin:4px 2px 0; line-height:1.15}
.sub{margin:2px 2px 12px; color:var(--muted)}
.sec{font-size:1.3rem; margin:18px 2px 8px}
.sec small,.tile small,.cover small,.cchip small{display:block; color:var(--muted); font-size:.8rem}

/* generic */
.bar{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.back{min-height:46px; padding:0 14px; border-radius:15px; background:var(--card); box-shadow:0 4px 0 var(--shadow); font-weight:700; font-size:.95rem; white-space:nowrap}
.ttl{flex:1; font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.15rem; text-align:center; line-height:1.15}
.pc{min-width:54px; text-align:right; color:var(--muted); font-size:.9rem}
.dots{display:flex; gap:6px; flex:1; justify-content:center; flex-wrap:wrap}
.dots i{width:15px; height:15px; border-radius:50%; background:var(--card); border:3px solid var(--line)}
.dots i.cur{border-color:var(--violet); transform:scale(1.2)}
.dots i.ok{background:var(--green); border-color:var(--green)}
.dots i.second{background:var(--sun); border-color:var(--sun)}
.dots i.bad{background:var(--coral); border-color:var(--coral)}
.big{display:block; width:100%; min-height:58px; margin-top:10px; border-radius:18px; background:var(--violet); color:#fff; font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.2rem; box-shadow:0 5px 0 color-mix(in srgb,var(--violet) 55%,#000)}
.big.alt{background:var(--card); color:var(--ink); border:3px solid var(--line); box-shadow:0 5px 0 var(--shadow)}
.big.sun{background:var(--sun); color:#2B2150; box-shadow:0 5px 0 #C58A00}
.big:active,.tile:active,.cover:active,.nav:active,.key:active,.ch:active{transform:translateY(3px)}
.mini{min-height:44px; padding:0 14px; border-radius:14px; background:var(--card); box-shadow:0 4px 0 var(--shadow); font-weight:700; font-size:.95rem}
.mini.on{background:var(--sun); color:#2B2150}
.star{color:var(--sun); letter-spacing:2px; text-shadow:0 1px 0 rgba(0,0,0,.15)}
.star .no{color:var(--line); text-shadow:none}

/* home */
.covers{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 10px; scroll-snap-type:x mandatory}
.cover{flex:0 0 min(62%,260px); scroll-snap-align:start; text-align:left; background:var(--card); border-radius:22px; padding:8px 8px 12px; box-shadow:0 5px 0 var(--shadow); display:flex; flex-direction:column; gap:6px}
.cover b{font-family:"Fredoka",sans-serif; font-size:1.1rem; padding:0 4px; line-height:1.2}
.cover .scene{border-radius:16px; box-shadow:none}
.cover .st{padding:0 4px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.tile{display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left; padding:14px; min-height:132px; border-radius:22px; background:var(--card); box-shadow:0 5px 0 var(--shadow); border-top:8px solid var(--c,var(--violet))}
.tile .ic{font-size:2.1rem; line-height:1}
.tile b{font-family:"Fredoka",sans-serif; font-size:1.1rem; line-height:1.15}
.tile .st{margin-top:auto}
.prog{margin:16px 2px 0; color:var(--muted); font-size:.95rem; text-align:center}

/* scenes: the picture-book */
.scene{--u:6px; position:relative; width:100%; aspect-ratio:4/3; border-radius:24px; overflow:hidden; background:linear-gradient(var(--sky1),var(--sky2)); box-shadow:0 5px 0 var(--shadow)}
.scene::before{content:""; position:absolute; left:-20%; right:30%; bottom:-24%; height:40%; border-radius:50%; background:color-mix(in srgb,var(--ground) 78%,#000); opacity:.55}
.scene::after{content:""; position:absolute; left:-12%; right:-12%; bottom:-22%; height:44%; border-radius:50% 50% 0 0 / 70% 70% 0 0; background:var(--ground)}
.it{position:absolute; transform:translateX(-50%); font-size:calc(var(--s)*var(--u)); line-height:1; z-index:2; filter:drop-shadow(0 3px 0 rgba(0,0,0,.14)); pointer-events:none}
.an{display:block; transform-origin:50% 100%; font-style:normal}
.an.bob{animation:bob 2.4s ease-in-out infinite}
.an.sway{animation:sway 3.4s ease-in-out infinite}
.an.float{animation:floaty 3.2s ease-in-out infinite}
.an.drift{animation:drift 6s ease-in-out infinite}
.an.fly{animation:fly 2.2s ease-in-out infinite}
.an.hop{animation:hop 1.4s ease-in-out infinite}
.an.twinkle{animation:twinkle 1.8s ease-in-out infinite}
.an.fall{animation:rain 1.3s linear infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes floaty{50%{transform:translateY(-10%)}}
@keyframes drift{50%{transform:translateX(10%)}}
@keyframes fly{25%{transform:translate(8%,-10%)}50%{transform:translate(0,-18%)}75%{transform:translate(-8%,-8%)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-22%)}}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}
@keyframes rain{from{transform:translateY(-20%);opacity:0}20%{opacity:.9}to{transform:translateY(260%);opacity:0}}

/* book */
.pagecard{background:var(--card); border-radius:28px; padding:10px 10px 16px; box-shadow:0 6px 0 var(--shadow)}
.pagecard.turn{animation:turn .35s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.stext{font-size:clamp(1.55rem,5.4vw,2.3rem); line-height:1.6; text-align:center; padding:14px 8px 4px}
.w{display:inline-block; padding:0 .1em; border-radius:12px; cursor:pointer}
.w.on{background:var(--sun); color:#2B2150}
.sen{text-align:center; color:var(--muted); font-size:1rem; padding:0 10px}
.wordbar{min-height:2.3em; text-align:center; font-size:1.15rem; padding-top:6px; color:var(--ink)}
.wordbar b{color:var(--violet)}
.ctl{display:flex; gap:10px; align-items:stretch; margin-top:12px}
.nav{width:76px; min-height:62px; border-radius:18px; background:var(--card); box-shadow:0 5px 0 var(--shadow); font-size:1.6rem; font-weight:700}
.nav:disabled{opacity:.35}
.ctl .big{margin-top:0; flex:1}
.ctl2{display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap}

/* quiz */
.qbox{position:relative; background:var(--card); border-radius:24px; padding:18px 14px; box-shadow:0 5px 0 var(--shadow); min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; margin-bottom:14px}
.pq{font-family:"Fredoka",sans-serif; font-size:1.5rem; font-weight:600; line-height:1.2}
.pq small{font-family:"Andika",sans-serif}
.bigemoji{font-size:clamp(4rem,18vw,6.2rem); line-height:1}
.bigword{font-family:"Fredoka",sans-serif; font-size:clamp(2rem,9vw,3rem); font-weight:600}
.spk{min-width:64px; min-height:54px; padding:0 18px; border-radius:16px; background:var(--sun); color:#2B2150; font-size:1.6rem; box-shadow:0 4px 0 #C58A00}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.choices.three{grid-template-columns:1fr 1fr 1fr}
.ch{min-height:104px; border-radius:22px; background:var(--card); box-shadow:0 5px 0 var(--shadow); border:4px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px; font-family:"Fredoka",sans-serif; font-weight:600}
.ch .e{font-size:clamp(3rem,13vw,4.4rem); line-height:1.05}
.ch .l{font-size:1.1rem}
.ch.txt{font-size:1.5rem}
.ch.art-der{background:var(--der); color:var(--artc); font-size:2rem}
.ch.art-die{background:var(--die); color:var(--artc); font-size:2rem}
.ch.art-das{background:var(--das); color:var(--artc); font-size:2rem}
.ch.ok{border-color:var(--green); box-shadow:0 0 0 6px color-mix(in srgb,var(--green) 35%,transparent)}
.ch.bad{border-color:var(--coral); opacity:.55; animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{min-height:2em; margin-top:12px; text-align:center; font-weight:700; font-size:1.15rem}
.fb.good{color:var(--green)} .fb.try{color:var(--coral)}
.art{display:inline-block; padding:0 .45em; border-radius:12px; color:var(--artc); font-weight:700; font-size:.75em; margin-right:.3em; vertical-align:.08em}
.art.der{background:var(--der)} .art.die{background:var(--die)} .art.das{background:var(--das)}

/* chips */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px}
.cchip{padding:8px 14px; border-radius:999px; background:var(--card); border:3px solid var(--line); font-weight:700; font-size:.95rem}
.cchip.on{background:var(--violet); border-color:var(--violet); color:#fff}

/* spelling */
.spbox{background:var(--card); border-radius:24px; padding:14px 10px 16px; box-shadow:0 5px 0 var(--shadow); display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:12px}
.wshow{min-height:2.4em; font-family:"Fredoka",sans-serif; font-size:clamp(1.8rem,8vw,2.6rem); font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center}
.cdbar{width:60%; height:8px; border-radius:6px; background:var(--line); overflow:hidden}
.cdbar i{display:block; height:100%; background:var(--sun); animation:cd 3.6s linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
.slots{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.slot{width:clamp(34px,10vw,56px); height:clamp(46px,12.5vw,68px); border-bottom:5px solid var(--ink); border-radius:10px 10px 0 0; background:color-mix(in srgb,var(--violet) 8%,transparent); font:700 clamp(1.7rem,6.5vw,2.5rem)/1 "Andika",sans-serif; display:flex; align-items:center; justify-content:center}
.slot.cur{border-color:var(--violet); background:color-mix(in srgb,var(--violet) 22%,transparent)}
.slot.ok{border-color:var(--green); color:var(--green)}
.slot.shake{animation:shake .4s}
.sptools{display:flex; gap:10px}
.kb{display:flex; flex-direction:column; gap:7px}
.kr{display:flex; gap:6px; justify-content:center}
.key{flex:1; max-width:62px; height:clamp(48px,7.6vh,62px); border-radius:13px; background:var(--card); box-shadow:0 4px 0 var(--shadow); font:700 1.45rem "Andika",sans-serif; text-transform:uppercase}
.key.wide{max-width:110px}
.key[data-k="ß"]{text-transform:none}
.key.bad{background:var(--coral); color:#fff}
.key.hint{background:var(--sun); color:#2B2150; animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}

/* memory */
.mem{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.mc{aspect-ratio:.8; border-radius:18px; background:var(--violet); color:#fff; box-shadow:0 5px 0 color-mix(in srgb,var(--violet) 55%,#000); font-size:2rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px; font-family:"Fredoka",sans-serif; font-weight:600; overflow:hidden}
.mc.up{background:var(--card); color:var(--ink); box-shadow:0 5px 0 var(--shadow)}
.mc.done{background:color-mix(in srgb,var(--green) 25%,var(--card)); border:4px solid var(--green)}
.mc .e{font-size:clamp(2.4rem,11vw,3.6rem); line-height:1}
.mc .wt{font-size:clamp(.85rem,3.4vw,1.2rem); text-align:center; line-height:1.1; word-break:break-word}

/* flashcards */
.fcard{width:100%; min-height:300px; background:var(--card); border-radius:28px; box-shadow:0 6px 0 var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px; text-align:center}
.fcard .en{font-size:1.5rem; color:var(--violet); font-weight:700}
.fhint{color:var(--muted); font-size:.9rem}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
.two .big{margin-top:0}

/* puzzle tiles */
.built{min-height:78px; background:var(--card); border-radius:20px; border:3px dashed var(--line); padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin-bottom:12px}
.built.good{border-color:var(--green)} .built.bad{border-color:var(--coral); animation:shake .4s}
.tiles{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.tile2{min-height:54px; padding:0 18px; border-radius:16px; background:var(--card); box-shadow:0 4px 0 var(--shadow); font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.35rem}
.tile2.used{opacity:.25}
.built .tile2{background:color-mix(in srgb,var(--violet) 14%,var(--card))}

/* phrases */
.plist{display:flex; flex-direction:column; gap:10px}
.ph{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 14px; border-radius:20px; background:var(--card); box-shadow:0 4px 0 var(--shadow)}
.ph .e{font-size:2.2rem; line-height:1}
.ph .t{flex:1}
.ph .t b{display:block; font-family:"Fredoka",sans-serif; font-size:1.25rem; line-height:1.2}
.ph .t span{color:var(--muted); font-size:.95rem}
.ph .s{font-size:1.4rem}

/* results & settings */
.res{background:var(--card); border-radius:28px; padding:26px 18px; text-align:center; box-shadow:0 6px 0 var(--shadow); margin-top:10px}
.res h2{margin:0 0 6px; font-size:1.9rem}
.bigstars{font-size:3.4rem; letter-spacing:6px}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.set{background:var(--card); border-radius:22px; padding:14px 16px; box-shadow:0 5px 0 var(--shadow); margin-bottom:12px}
.set h3{margin:0 0 8px; font-size:1.1rem}
.set p{margin:4px 0; color:var(--muted); font-size:.95rem}
.set input[type=text]{width:100%; height:52px; border-radius:14px; border:3px solid var(--line); padding:0 14px; font:700 1.3rem "Andika",sans-serif; color:var(--ink); background:var(--bg)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
.confetti i{position:absolute; top:-10%; font-style:normal; animation:fall 2s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(112vh) rotate(380deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px;font:18px sans-serif">Bitte JavaScript einschalten und die Datei direkt in einem Browser wie Chrome öffnen.<br>Please turn on JavaScript and open this file directly in a browser such as Chrome.</p></noscript>
<div class="wrap">
  <header class="top">
    <button class="brand" data-top="home" aria-label="Start">🦉 Deutsch-Entdecker</button>
    <button class="chip" data-top="settings" aria-label="Einstellungen / Settings">⚙️</button>
  </header>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let P = Object.assign({name:"Juan",tr:true,rate:.8}, store.get("de-prefs",{}));
let S = Object.assign({stars:{},known:{},mastery:{}}, store.get("de-save",{}));
const savePrefs = () => store.set("de-prefs",P);
const saveS = () => store.set("de-save",S);
const fill = t => t.replace(/\{name\}/g,P.name);
const lbl = (de,en) => `${de}${P.tr?`<small>${en}</small>`:""}`;
const starsStr = n => `<span class="star">${"★".repeat(n)}<span class="no">${"★".repeat(3-n)}</span></span>`;
const PRAISE = ["Super!","Richtig!","Toll!","Klasse!","Prima!","Sehr gut!","Genau!"];

/* ============ word data ============ */
const RAW = [
 // Tiere
 ["Hund","der","dog","🐶","tiere"],["Katze","die","cat","🐱","tiere"],["Bär","der","bear","🐻","tiere"],["Vogel","der","bird","🐦","tiere"],
 ["Fisch","der","fish","🐟","tiere"],["Pferd","das","horse","🐴","tiere"],["Kuh","die","cow","🐮","tiere"],["Hase","der","rabbit","🐰","tiere"],
 ["Igel","der","hedgehog","🦔","tiere"],["Biene","die","bee","🐝","tiere"],["Schwein","das","pig","🐷","tiere"],["Maus","die","mouse","🐭","tiere"],
 ["Frosch","der","frog","🐸","tiere"],["Ente","die","duck","🦆","tiere"],["Löwe","der","lion","🦁","tiere"],["Affe","der","monkey","🐵","tiere"],
 // Essen

/* ============ sound & speech ============ */
let ac;
function tone(f,start,dur,type,vol){
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
  const t0=ac.currentTime+start, v=vol||.08;
  g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.start(t0); o.stop(t0+dur+.02);
}
function sfx(k,n){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    if(k==="ok"){ tone(660,0,.14); tone(880,.12,.22); }
    else if(k==="bad"){ tone(240,0,.26,"triangle",.1); }
    else if(k==="tick"){ tone(420+(n||0)*30,0,.1); }
    else if(k==="done"){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.25)); }
  }catch(e){}
}
const hasTTS = "speechSynthesis" in window;
let voice=null, sid=0, timers=[];
function loadVoice(){
  if(!hasTTS) return;
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/^de[-_]/i.test(v.lang)&&/google|enhanced|premium|natural/i.test(v.name)) || vs.find(v=>/^de([-_]|$)/i.test(v.lang)) || null;
}
if(hasTTS){ loadVoice(); try{ speechSynthesis.onvoiceschanged=loadVoice; }catch(e){} }
function stopSpeak(){
  sid++; timers.forEach(clearTimeout); timers=[];
  if(hasTTS){ try{ speechSynthesis.cancel(); }catch(e){} }
}
function say(text,o){
  o=o||{}; stopSpeak(); const my=sid; let ended=false, gotB=false;
  const done=()=>{ if(ended||my!==sid) return; ended=true; if(o.onend) o.onend(); };
  const words=[]; const re=/[A-Za-zÄÖÜäöüß]+/g; let m; while((m=re.exec(text))) words.push({s:m.index,l:m[0].length});
  const sp=P.rate/.8;
  const est=Math.max(900, words.reduce((t,w)=>t+300+60*w.l,0)/sp);
  const hi=i=>{ if(my===sid&&o.onword) o.onword(i); };
  const timed=()=>{ let t=0; words.forEach((w,i)=>{ timers.push(setTimeout(()=>{ if(!gotB) hi(i); },t)); t+=(300+60*w.l)/sp; }); };
  if(!hasTTS){ if(o.onword) timed(); timers.push(setTimeout(done,est)); return; }
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang="de-DE"; if(voice) u.voice=voice; u.rate=o.rate||P.rate; u.pitch=1.05;
    u.onboundary=e=>{
      if(e.name&&e.name!=="word") return;
      gotB=true; const ci=e.charIndex||0; let idx=-1;
      for(let i=0;i<words.length;i++){ if(words[i].s<=ci) idx=i; }
      if(idx>=0) hi(idx);
    };
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
    if(o.onword) timers.push(setTimeout(()=>{ if(!gotB&&my===sid) timed(); },900));
    timers.push(setTimeout(done,est+2500));
  }catch(e){ timers.push(setTimeout(done,est)); }
}
function burst(){
  const d=document.createElement("div"); d.className="confetti";
  const em=["⭐","🎉","✨","🌟","🎈","💛"];
  for(let i=0;i<26;i++){
    const s=document.createElement("i"); s.textContent=pick(em);
    s.style.left=ri(2,96)+"%"; s.style.animationDelay=(Math.random()*.6)+"s"; s.style.fontSize=(1+Math.random()*1.4)+"rem";
    d.appendChild(s);
  }
  document.body.appendChild(d); setTimeout(()=>d.remove(),2900);
}

function tokenize(text){
  const out=[]; const re=/([A-Za-zÄÖÜäöüß]+)|([^A-Za-zÄÖÜäöüß]+)/g; let m,wi=0;
  while((m=re.exec(text))){
    if(m[1]) out.push(`<span class="w" data-act="word" data-w="${esc(m[1])}" data-i="${wi++}">${m[1]}</span>`);
    else out.push(esc(m[2]));
  }
  return out.join("");
}

let Q=null;
function dotsHTML(n,cur,res){ let h=""; for(let i=0;i<n;i++) h+=`<i class="${res[i]||(i===cur?"cur":"")}"></i>`; return h; }
function runQuiz(o){
  setRoute("quiz");
  Q={o,qs:o.gen(),i:0,score:0,tries:0,locked:false,res:[]};
  drawQ();
}
function drawQ(){
  const q=Q.qs[Q.i];
  setMain(`
  <div class="bar"><button class="back" data-act="quit">← ${esc(Q.o.backLabel||"Zurück")}</button><div class="dots">${dotsHTML(Q.qs.length,Q.i,Q.res)}</div></div>
  <div class="qbox">${q.prompt}${q.say?`<button class="spk" data-act="qsay" aria-label="Hören">🔊</button>`:""}</div>
  <div class="choices${q.choices.length===3&&q.threeCols?" three":""}">${q.choices.map((c,k)=>`<button class="ch ${c.cls||""}" data-act="choice" data-k="${k}">${c.html}</button>`).join("")}</div>
  <div class="fb" id="fb"></div>`);
  Q.tries=0; Q.locked=false;
  if(q.say&&q.auto!==false) setTimeout(()=>{ if(Q&&route.name==="quiz") say(q.say); },300);
}
function fb(t,c){ const f=$("#fb"); if(f){ f.textContent=t; f.className="fb "+(c||""); } }
acts.qsay = () => { const q=Q.qs[Q.i]; if(q.say) say(q.say); };
acts.quit = () => go(Q.o.back||"words");
acts.choice = el => {
  if(!Q||Q.locked) return;
  const q=Q.qs[Q.i], k=+el.dataset.k, c=q.choices[k];
  const btns=[...document.querySelectorAll(".ch")];
  if(c.ok){
    Q.locked=true; el.classList.add("ok");
    Q.res[Q.i]=Q.tries===0?"ok":"second"; if(Q.tries===0) Q.score++;
    sfx("ok"); fb("✔ "+pick(PRAISE),"good");
    if(q.reveal) say(q.reveal);
    setTimeout(nextQ,q.reveal?1700:900);
  } else {
    Q.tries++; el.classList.add("bad"); el.disabled=true; sfx("bad");
    if(Q.tries>=2){
      Q.locked=true; Q.res[Q.i]="bad";
      q.choices.forEach((cc,kk)=>{ if(cc.ok) btns[kk].classList.add("ok"); });
      if(q.reveal) say(q.reveal);
      fb("→ "+(q.reveal||""),"try"); setTimeout(nextQ,2000);
    } else fb("Versuch es noch einmal!","try");
  }
};
function nextQ(){
  if(!Q||route.name!=="quiz") return;
  Q.i++;
  if(Q.i>=Q.qs.length){
    const o=Q.o, score=Q.score, total=Q.qs.length;
    showResult({key:o.key,score,total,line:`${score} / ${total} ${P.tr?"gleich richtig / right first time":"gleich richtig"}`,
      again:()=>runQuiz(o), back:o.back||"words", backLabel:o.backLabel, extra:o.extra});
  } else drawQ();
}

function distract(w,n){
  const same=WORDS.filter(x=>x.cat===w.cat&&x.de!==w.de);
  return shuffle(same.length>=n?same:WORDS.filter(x=>x.de!==w.de)).slice(0,n);

function genWordQuiz(g){
  let p=pool(); if(g==="article") p=p.filter(w=>w.art);
  if(p.length<2) p=WORDS;
  return shuffle(p).slice(0,Math.min(8,p.length)).map(w=>{
    const opts=shuffle([w].concat(distract(w,3)));
    if(g==="listen") return {
      prompt:`<div class="pq">${lbl("Was hörst du?","What do you hear?")}</div>`, say:nm(w), reveal:nm(w),
      choices:opts.map(x=>({html:`<span class="e">${x.e}</span>`,ok:x===w}))};

      choices:opts.map(x=>({html:`${artHTML(x)}${esc(x.de)}`,cls:"txt",ok:x===w}))};

const SPELL_MODES=[
 ["copy","📝","Abschreiben","Copy the word","★☆☆"],
 ["merk","🧠","Merken & Schreiben","Look, remember, write","★★☆"],
 ["listen","👂","Hören & Schreiben","Listen and write","★★☆"],
 ["picture","🖼️","Bild & Schreiben","Picture and write","★★★"]

function vSpell(){
  setMain(`<div class="bar"><button class="back" data-act="go" data-to="home">← ${lbl("Start","Home")}</button><div class="ttl">✍️ ${lbl("Buchstabieren","Spelling")}</div></div>

}

let SP=null;
function startSpell(mode,override,back){
  setRoute("spellplay");
  const base=override&&override.length?override:pool();
  let cand=base.filter(w=>w.de.length<=(mode==="picture"?10:9));
  if(cand.length<3) cand=base;
  cand=shuffle(cand).sort((a,b)=>(S.mastery[a.de]||0)-(S.mastery[b.de]||0));
  const words=shuffle(cand.slice(0,Math.min(6,cand.length)));
  SP={mode,words,i:0,pos:0,mis:0,hints:0,wrongRun:0,locked:false,score:0,res:[],back:back||"spell",override};
  drawSpell();
}
const KEYROWS=["abcdefghi","jklmnopqr","stuvwxyzß"];
function drawSpell(){
  const w=SP.words[SP.i], m=SP.mode;
  const slots=[...w.de].map((_,k)=>`<div class="slot${k===0?" cur":""}" id="sl${k}"></div>`).join("");
  const show = m==="copy"||m==="merk";
  setMain(`
  <div class="bar"><button class="back" data-act="spquit">← ${lbl("Zurück","Back")}</button><div class="dots">${dotsHTML(SP.words.length,SP.i,SP.res)}</div></div>
  <div class="spbox">
    <div class="bigemoji an bob">${w.e}</div>
    <div class="wshow" id="wshow">${artHTML(w)}${show?esc(w.de):(m==="picture"?"":"❓")}</div>
    ${m==="merk"?`<div class="cdbar" id="cd"><i></i></div>`:""}
    <div class="slots" id="slots">${slots}</div>
    <div class="sptools"><button class="mini" data-act="spsay">🔊 ${lbl("Hören","Listen")}</button><button class="mini" data-act="sphint">💡 ${lbl("Tipp","Hint")}</button></div>
  </div>
  <div class="kb">
    ${KEYROWS.map(r=>`<div class="kr">${[...r].map(k=>`<button class="key" data-act="key" data-k="${k}">${k}</button>`).join("")}</div>`).join("")}
    <div class="kr">${["ä","ö","ü"].map(k=>`<button class="key" data-act="key" data-k="${k}">${k}</button>`).join("")}<button class="key wide" data-act="key" data-k="bs" aria-label="Löschen">⌫</button></div>
  </div>`);
  SP.pos=0; SP.mis=0; SP.hints=0; SP.wrongRun=0; SP.locked=false;
  if(m==="merk"){
    SP.cdT=setTimeout(()=>{ const ws=$("#wshow"); if(ws&&route.name==="spellplay"&&SP.words[SP.i]===w){ ws.innerHTML=`${artHTML(w)}❓`; const cd=$("#cd"); if(cd) cd.remove(); } },3600);
  }
  if(m!=="picture") setTimeout(()=>{ if(route.name==="spellplay"&&SP.words[SP.i]===w) say(nm(w)); },300);
}
function slotEl(k){ return document.getElementById("sl"+k); }
function paintSlots(){
  const w=SP.words[SP.i];
  [...w.de].forEach((ch,k)=>{
    const s=slotEl(k); if(!s) return;
    s.textContent=k<SP.pos?ch:"";
    s.className="slot"+(k<SP.pos?" ok":"")+(k===SP.pos&&!SP.locked?" cur":"");
  });
  document.querySelectorAll(".key.hint").forEach(k=>k.classList.remove("hint"));
}
function typeKey(k){
  if(!SP||SP.locked||route.name!=="spellplay") return;
  const w=SP.words[SP.i];
  if(k==="bs"){ if(SP.pos>0){ SP.pos--; paintSlots(); } return; }
  const exp=w.de[SP.pos].toLowerCase();
  if(k===exp){
    SP.pos++; SP.wrongRun=0; sfx("tick",SP.pos); paintSlots();
    if(SP.pos===w.de.length) spellDone();
  } else {
    SP.mis++; SP.wrongRun++; sfx("bad");
    const kb=document.querySelector(`.key[data-k="${k}"]`); if(kb){ kb.classList.add("bad"); setTimeout(()=>kb.classList.remove("bad"),450); }
    const s=slotEl(SP.pos); if(s){ s.classList.add("shake"); setTimeout(()=>s.classList.remove("shake"),420); }
    if(SP.wrongRun>=2){ const hk=document.querySelector(`.key[data-k="${exp}"]`); if(hk) hk.classList.add("hint"); }
  }
}
acts.key = el => typeKey(el.dataset.k);
acts.spsay = () => say(nm(SP.words[SP.i]));
acts.sphint = () => {
  if(!SP||SP.locked) return; const w=SP.words[SP.i];
  SP.hints++; SP.pos++; sfx("tick",SP.pos); paintSlots();
  if(SP.pos===w.de.length) spellDone();
};
acts.spquit = () => { if(SP&&SP.cdT) clearTimeout(SP.cdT); go(SP.back); };
function spellDone(){
  SP.locked=true; const w=SP.words[SP.i];
  const stars=SP.mis===0&&SP.hints===0?3:(SP.mis<=2&&SP.hints<=1?2:1);
  SP.score+=stars; SP.res[SP.i]=stars===3?"ok":stars===2?"second":"bad";
  S.mastery[w.de]=(S.mastery[w.de]||0)+1; saveS();
  document.querySelectorAll(".slot").forEach(s=>{ s.className="slot ok"; });
  const ws=$("#wshow"); if(ws) ws.innerHTML=`${artHTML(w)}${esc(w.de)}`;
  sfx("ok"); say(nm(w));
  const cur=SP.i;
  setTimeout(()=>{
    if(!SP||route.name!=="spellplay"||SP.i!==cur) return;
    SP.i++;
    if(SP.i>=SP.words.length){
      const total=SP.words.length*3, pct=SP.score/total;
      const stars=pct>=.85?3:pct>=.6?2:1; const sp=SP;
      showResult({key:"spell-"+sp.mode,stars,score:sp.score,total,line:`${sp.words.length} ${P.tr?"Wörter geschrieben / words written":"Wörter geschrieben"}`,
        again:()=>startSpell(sp.mode,sp.override,sp.back),back:sp.back,backLabel:sp.back==="stories"?"Geschichten":"Buchstabieren"});
    } else drawSpell();
  },1800);
}
document.addEventListener("keydown",e=>{
  if(route.name!=="spellplay"||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Backspace"){ typeKey("bs"); e.preventDefault(); }
  else if(e.key.length===1&&/[a-zäöüß]/i.test(e.key)) typeKey(e.key.toLowerCase());
});

/* ============ phrases & sentence puzzle ============ */
function vPhrases(){
  setMain(`<div class="bar"><button class="back" data-act="go" data-to="home">← ${lbl("Start","Home")}</button><div class="ttl">💬 ${lbl("Sätze","Phrases")}</div></div>
  <button class="big sun" data-act="puzzle" style="margin-top:0;margin-bottom:12px">🧩 ${lbl("Satz-Puzzle spielen","Play sentence puzzle")}</button>
  <div class="plist">${PHRASES.map((p,i)=>`
   <button class="ph" data-act="phsay" data-i="${i}"><span class="e">${p[2]}</span><span class="t"><b>${esc(fill(p[0]))}</b>${P.tr?`<span>${esc(fill(p[1]))}</span>`:""}</span><span class="s">🔊</span></button>`).join("")}</div>`);
}
acts.phsay = el => say(fill(PHRASES[+el.dataset.i][0]));
let Z=null;
acts.puzzle = () => startPuzzle();
function startPuzzle(){
  setRoute("puzzle");
  const items=shuffle(PHRASES.filter(p=>p[0].split(" ").length>=2)).slice(0,6).map(p=>{
    const de=fill(p[0]), toks=de.split(" ");
    let tiles=toks.map((t,i)=>({t,i,used:false}));
    for(let n=0;n<8;n++){ const sh=shuffle(tiles); tiles=sh; if(sh.map(x=>x.t).join(" ")!==de) break; }
    return {de,en:fill(p[1]),e:p[2],toks,tiles};
  });
  Z={items,i:0,built:[],tries:0,score:0,res:[],locked:false};
  drawPuzzle();
}
function drawPuzzle(){
  const it=Z.items[Z.i];
  setMain(`<div class="bar"><button class="back" data-act="zquit">← ${lbl("Sätze","Phrases")}</button><div class="dots">${dotsHTML(Z.items.length,Z.i,Z.res)}</div></div>
  <div class="qbox"><div class="bigemoji" style="font-size:3.6rem">${it.e}</div>${P.tr?`<div class="pq">${esc(it.en)}</div>`:""}<button class="spk" data-act="zsay" aria-label="Hören">🔊</button></div>
  <div class="built" id="built">${Z.built.map((b,k)=>`<button class="tile2" data-act="zun" data-k="${k}">${esc(b.t)}</button>`).join("")||`<span class="fhint">${lbl("Tippe die Wörter in der richtigen Reihenfolge","Tap the words in the right order")}</span>`}</div>
  <div class="tiles">${it.tiles.map((t,k)=>`<button class="tile2${t.used?" used":""}" data-act="ztile" data-k="${k}" ${t.used?"disabled":""}>${esc(t.t)}</button>`).join("")}</div>
  <div class="fb" id="fb"></div>`);
}
acts.zsay = () => say(Z.items[Z.i].de);
acts.zquit = () => go("phrases");
acts.ztile = el => {
  if(!Z||Z.locked) return; const it=Z.items[Z.i], k=+el.dataset.k;
  it.tiles[k].used=true; Z.built.push({t:it.tiles[k].t,k}); sfx("tick",Z.built.length);
  if(Z.built.length===it.toks.length) return zcheck();
  drawPuzzle();
};
acts.zun = el => {
  if(!Z||Z.locked) return; const it=Z.items[Z.i], k=+el.dataset.k, b=Z.built[k];
  it.tiles[b.k].used=false; Z.built.splice(k,1); drawPuzzle();
};
function zcheck(){
  const it=Z.items[Z.i], ok=Z.built.map(b=>b.t).join(" ")===it.de;
  drawPuzzle(); const bl=$("#built");
  if(ok){
    Z.locked=true; bl.classList.add("good"); sfx("ok"); fb("✔ "+pick(PRAISE),"good"); say(it.de);
    Z.res[Z.i]=Z.tries===0?"ok":"second"; if(Z.tries===0) Z.score++;
    setTimeout(()=>{
      if(!Z||route.name!=="puzzle") return;
      Z.i++; Z.built=[]; Z.tries=0; Z.locked=false;
      if(Z.i>=Z.items.length){ showResult({key:"puzzle",score:Z.score,total:Z.items.length,line:`${Z.score} / ${Z.items.length} ${P.tr?"gleich richtig / right first time":"gleich richtig"}`,again:startPuzzle,back:"phrases",backLabel:"Sätze"}); }
      else drawPuzzle();
    },2000);
  } else {
    Z.tries++; bl.classList.add("bad"); sfx("bad"); fb(P.tr?"Fast! Tippe ein Wort zum Entfernen. / Almost! Tap a word to remove it.":"Fast! Tippe ein Wort zum Entfernen.","try");
  }
}

/* ============ settings (for parents, English) ============ */
function vSettings(){
  const de=voice?`German voice found: ${esc(voice.name)}`:(hasTTS?"No German voice found yet.":"This browser cannot read aloud.");
  setMain(`<div class="bar"><button class="back" data-act="go" data-to="home">← Home</button><div class="ttl">⚙️ Settings</div></div>
  <div class="set"><h3>Name</h3><input type="text" id="nameIn" value="${esc(P.name)}" maxlength="16" aria-label="Name"><p>Used in greetings and in the story “Der Regenbogen”.</p></div>
  <div class="set"><h3>English hints</h3><div class="row"><button class="mini${P.tr?" on":""}" data-act="settr">On</button><button class="mini${!P.tr?" on":""}" data-act="settr" data-off="1">Off</button></div><p>Shows English translations under German texts. Turn off for full German.</p></div>
  <div class="set"><h3>Reading speed</h3><div class="row">${[[.6,"Slow"],[.8,"Normal"],[1,"Fast"]].map(r=>`<button class="mini${P.rate===r[0]?" on":""}" data-act="rate" data-r="${r[0]}">${r[1]}</button>`).join("")}</div></div>
  <div class="set"><h3>Voice</h3><p>${de}</p><div class="row"><button class="mini" data-act="testvoice">🔊 Test voice</button></div>
  <p>No sound? On the tablet open Settings → System → Languages → Text-to-speech output, choose Google, and install German.</p></div>
  <div class="set"><h3>Progress</h3><p>Stars and practised words are saved on this device.</p><div class="row"><button class="mini" data-act="reset">Reset progress</button></div></div>`);
}
main.addEventListener("input",e=>{ if(e.target.id==="nameIn"){ P.name=e.target.value.slice(0,16); savePrefs(); } });
acts.settr = el => { P.tr=!el.dataset.off; savePrefs(); render(); };
acts.rate = el => { P.rate=parseFloat(el.dataset.r); savePrefs(); render(); };
acts.testvoice = () => say("Hallo "+(P.name||"Juan")+"! Ich spreche Deutsch.");
acts.reset = () => { if(confirm("Reset all stars and progress?")){ S={stars:{},known:{},mastery:{}}; saveS(); render(); } };

/* ============ start ============ */
if(!P.name||!P.name.trim()) P.name="Juan";
render();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
